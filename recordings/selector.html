
        <!DOCTYPE html>
        <html>
        <head>
            <title>Select Preferred Video</title>
            <style>
                body { 
                    font-family: Arial; 
                    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); 
                    color: white; 
                    padding: 20px;
                    min-height: 100vh;
                }
                h1 { text-align: center; color: #4cc9f0; }
                .container { 
                    display: flex; 
                    flex-wrap: wrap; 
                    justify-content: center; 
                    gap: 30px; 
                    padding: 20px;
                }
                .video-card { 
                    background: rgba(255,255,255,0.1); 
                    padding: 20px; 
                    border-radius: 15px;
                    text-align: center;
                }
                video { 
                    border-radius: 10px; 
                    margin: 10px 0;
                }
                button { 
                    background: #4cc9f0; 
                    border: none; 
                    padding: 15px 40px; 
                    font-size: 18px;
                    border-radius: 8px; 
                    cursor: pointer;
                    transition: all 0.3s;
                }
                button:hover { 
                    background: #7dd3fc; 
                    transform: scale(1.05);
                }
                .selected { 
                    display: none;
                    text-align: center;
                    font-size: 24px;
                    color: #4ade80;
                    margin-top: 30px;
                }
            </style>
        </head>
        <body>
            <h1>Which video do you prefer?</h1>
            <div class="container">
            <div class="video-card">
                <h3>Checkpoint 100 (early training)</h3>
                <video controls width="400">
                    <source src="quad_tac_71.mp4" type="video/mp4">
                </video>
                <button onclick="select(0)">Select This One</button>
            </div>
            
            <div class="video-card">
                <h3>Checkpoint 200 (mid training)</h3>
                <video controls width="400">
                    <source src="quad_tac_85.mp4" type="video/mp4">
                </video>
                <button onclick="select(1)">Select This One</button>
            </div>
            </div>
            <div class="selected" id="selected">
                Selection saved! You can close this window.
            </div>
            <script>
                function select(index) {
                    fetch('/select', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({selection: index})
                    }).then(() => {
                        document.querySelector('.container').style.display = 'none';
                        document.getElementById('selected').style.display = 'block';
                    });
                }
            </script>
        </body>
        </html>
